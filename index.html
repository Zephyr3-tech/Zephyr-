function render(){

const snap=()=>({view,cur,showAuth,amode});
function apply(o){view=o.view;cur=o.cur;showAuth=o.showAuth;amode=o.amode;q='';document.body.classList.remove('menu');render();scrollTo(0,0)}
function navTo(fn){stack.push(snap());try{history.pushState({ct:1},'')}catch(e){canHist=false}fn();q='';document.body.classList.remove('menu');render();scrollTo(0,0)}
function back(fb){
  if(!stack.length){if(fb)fb();document.body.classList.remove('menu');render();scrollTo(0,0);return}
  if(canHist){const n=stack.length;try{history.back();setTimeout(()=>{if(stack.length===n)apply(stack.pop())},300);return}catch(e){canHist=false}}
  apply(stack.pop());
}
addEventListener('popstate',()=>{if(stack.length)apply(stack.pop())});
function go(v){if(v===view&&cur==null&&!showAuth){document.body.classList.remove('menu');scrollTo(0,0);return}navTo(()=>{view=v;cur=null})}
async function doAuth(f){
  const fd=new FormData(f),m=amode,matric=(fd.get('matric')||'').trim(),pw=fd.get('pw')||'',er=$('#aerr');
  const fail=t=>{er.textContent=t;er.hidden=false};er.hidden=true;
  if(!matric||!pw)return fail('Enter your matric number and password.');
  if(sb)return cloudAuth(fd,m,matric,pw,fail);
  if(!window.crypto||!crypto.subtle)return fail('This browser cannot secure passwords. Open the page in a current browser.');
  const k=rk(matric),accs=LS.g('ct:accounts',{}),h=await sha(k+'|'+pw);
  if(m==='signup'){
    const name=(fd.get('name')||'').trim();
    if(!name)return fail('Enter your full name.');
    if(pw.length<6)return fail('Use a password of at least 6 characters.');
    if(accs[k])return fail('An account with this number already exists. Log in instead.');
    accs[k]={name,matric:matric.toUpperCase(),level:fd.get('level'),dept:fd.get('dept'),h};LS.s('ct:accounts',accs);
  }else if(!accs[k]||accs[k].h!==h)return fail('Wrong matric number or password.');
  user=accs[k];LS.s('ct:session',{k});data=LS.g(dk(),{});view='home';stack=[];showAuth=false;render();
}
async function ask(){
  const q=($('#aiq').value||'').trim(),out=$('#ans');if(!q)return;out.hidden=false;out.textContent='Thinking…';
  try{
    const s=window.claude?await claude.use('sample'):null;if(!s)throw {code:'na'};
    const r=await s('You are the support assistant inside CampusTrack, a student app. Answer in under 80 words, only about the app. Facts: students create an account with a matric number and password; Schedule holds lectures and deadlines; Events, Venues, Assignments, Pomodoro Timer, Reading List, Office Hours, Campus Map, Notice Board, Study Groups, Lost and Found, Materials and Alerts; Support has tickets; data is saved on this device only.\nIf unsure, say so and suggest sending a ticket.\nQuestion: '+q,{cache:false,onText:({text})=>{out.textContent=text}});
    out.textContent=r.text;
  }catch(e){out.textContent=(e&&(e.code==='na'||e.code==='not_granted'))?'The assistant is not available here. Send a ticket below.':'The assistant could not answer right now. Try again or send a ticket.'}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-menu],[data-out],[data-del],[data-mode],[data-ask],[data-open],[data-back],[data-goback],[data-eye],[data-course],[data-cback],[data-delnote],[data-delcourse],[data-tgl],[data-rem],[data-today],[data-mv],[data-chk],[data-pm],[data-join],[data-lf]');if(!t)return;
  if(t.dataset.go)go(t.dataset.go);
  else if('menu' in t.dataset)document.body.classList.toggle('menu');
  else if('out' in t.dataset){user=null;data={};fD=null;fC='';fDay='';LS.r('ct:session');if(sb)sb.auth.signOut();document.body.classList.remove('menu');amode='login';showAuth=false;stack=[];view='home';cur=null;render()}
  else if(t.dataset.open)navTo(()=>{amode=t.dataset.open;showAuth=true})
  else if('back' in t.dataset)back(()=>{showAuth=false})
  else if('goback' in t.dataset)back()
  else if('eye' in t.dataset){const pw=$('#af [name=pw]'),sh=pw.type==='password';pw.type=sh?'text':'password';t.setAttribute('aria-label',sh?'Hide password':'Show password')}
  else if(t.dataset.course)navTo(()=>{cur=+t.dataset.course})
  else if('cback' in t.dataset)back(()=>{cur=null})
  else if(t.dataset.delnote){courses()[cur].notes=courses()[cur].notes.filter((_,j)=>j!==+t.dataset.delnote);save();render()}
  else if('delcourse' in t.dataset){data.courses=courses().filter((_,j)=>j!==cur);cur=null;save();render();scrollTo(0,0)}
  else if(t.dataset.mode){amode=t.dataset.mode;render()}
  else if('ask' in t.dataset)ask();
  else if('tgl' in t.dataset){theme=theme==='dark'?'light':'dark';LS.s('ct:theme',theme);setTheme();render()}
  else if(t.dataset.rem){const id=t.dataset.rem;data.rem=data.rem||{};data.rem[id]=!data.rem[id];save();t.outerHTML=remBtn(id)}
  else if('today' in t.dataset){fDay=fDay===todayN()?'':todayN();render()}
  else if(t.dataset.mv){const [i,d]=t.dataset.mv.split(':'),x=data.tasks[+i];x.s=Math.min(2,Math.max(0,+x.s+ +d));save();render()}
  else if('chk' in t.dataset){const x=data.reading[+t.dataset.chk];x.done=!x.done;save();render()}
  else if(t.dataset.pm){const a=t.dataset.pm;if(a==='toggle')pm.run=!pm.run;else if(a==='reset'){pm.run=false;pm.left=pmLen(pm.mode)}else{pm.mode=a;pm.run=false;pm.left=pmLen(a)}render()}
  else if(t.dataset.join){data.joined=data.joined||{};data.joined[t.dataset.join]=!data.joined[t.dataset.join];save();render()}
  else if('lf' in t.dataset){lf=t.dataset.lf;render()}
  else if(t.dataset.del){const [k,i]=t.dataset.del.split(':');data[k]=list(k).filter((_,j)=>j!==+i);save();render()}
});

const SUPABASE_URL='YOUR_SUPABASE_URL',SUPABASE_KEY='YOUR_SUPABASE_ANON_KEY';

const em=m=>rk(m).toLowerCase()+'@campustrack.app';
async function loadShared(){
  const [e,n]=await Promise.all([sb.from('events').select('*').order('date'),sb.from('notices').select('*').order('created_at',{ascending:false})]);
  if(e.data&&e.data.length){EVTS.length=0;e.data.forEach(r=>EVTS.push({id:'c'+r.id,k:r.kind||'Event',i:r.icon||'📅',t:r.title,date:r.date,tm:String(r.time).slice(0,5),v:r.venue||'TBA',x:r.details||''}))}
  if(n.data&&n.data.length){NOTICES.length=0;n.data.slice().reverse().forEach(r=>NOTICES.push({by:r.by_name,t:r.title,x:r.body,at:new Date(r.created_at).getTime()}));nShown=NOTICES.length}
}
async function enter(session){
  const {data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(!p)return false;
  user={id:p.id,name:p.name,matric:p.matric,level:p.level,dept:p.dept,role:p.role};
  const {data:d}=await sb.from('user_data').select('data').eq('user_id',p.id).maybeSingle();
  data=(d&&d.data)||LS.g(dk(),{});LS.s(dk(),data);
  await loadShared();return true;
}
async function cloudAuth(fd,m,matric,pw,fail){
  const email=em(matric);let r;
  if(m==='signup'){
    const name=(fd.get('name')||'').trim();
    if(!name)return fail('Enter your full name.');
    if(pw.length<6)return fail('Use a password of at least 6 characters.');
    r=await sb.auth.signUp({email,password:pw,options:{data:{name,matric:matric.toUpperCase(),level:fd.get('level'),dept:fd.get('dept')}}});
    if(r.error)return fail(/registered/i.test(r.error.message)?'An account with this number already exists. Log in instead.':r.error.message);
    if(!r.data.session)return fail('Account created. Turn off "Confirm email" in Supabase, then log in.');
  }else{
    r=await sb.auth.signInWithPassword({email,password:pw});
    if(r.error)return fail('Wrong matric number or password.');
  }
  if(!(await enter(r.data.session)))return fail('Could not load your profile. Try again.');
  view='home';stack=[];showAuth=false;render();
}
const adminForm=()=>user&&user.role==='admin'&&sb?`<form class="card" data-adm style="display:grid;gap:10px;margin-top:16px"><h3 style="margin:0">Admin: post to everyone</h3><label>Type<select name="kind"><option value="notice">Notice</option><option value="event">Event</option></select></label><label>Title<input name="title" required maxlength="100"></label><label>Details<input name="body" required maxlength="400"></label><label>Venue (events)<input name="venue" maxlength="80"></label><label>Date (events)<input name="date" type="date"></label><label>Time (events)<input name="time" type="time"></label><button class="btn gold" type="submit">Post</button></form>`:'';

document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;

});
